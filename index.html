<!DOCTYPE html>
<html>
    <head>
        <link rel = "stylesheet" href = "styles.css">
        <title>password-generator</title>
    </head>
    <body>
        <h1>Hello, User</h1>
        <h1>You can generate a</h1>
        <h1>random password here</h1>
        <p>never use an insecure password again</p>
        <label>
            <input type = "number" id = "password-length" min = "1" max = "20" step = "1" value = "8">
            choose the length of the password (from 1 to 20)
        </label>
        <br>
        <label>
            <input type = "checkbox" id = "numbers" checked>
            numbers
        </label>
        <label>
            <input type = "checkbox" id = "symbols" checked>
            special symbols
        </label>
        <br>
        <button id = "generate-button">Generate</button>
        <div id = "first-button"></div>
        <p class = "copy" id = "copy-message1"></p>
        <div id = "second-button"></div>
        <p class = "copy" id = "copy-message2"></p>
        <script src = index.js></script>
    </body>
</html>
